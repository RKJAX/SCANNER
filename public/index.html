<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер неэффективностей</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app" class="container">
    <!-- HEADER -->
    <header class="header">
      <h1>📊 Сканер неэффективностей</h1>
      <div id="status" class="status"></div>
    </header>

    <!-- FILTERS -->
    <section class="filters">
      <div class="filter-group">
        <label>🎯 Биржи</label>
        <div id="exchanges-list" class="exchanges-list"></div>
        <div class="exchange-controls">
          <button id="select-all" class="btn btn-small">Выбрать все</button>
          <button id="clear-all" class="btn btn-small">Очистить</button>
        </div>
      </div>

      <div class="filter-group">
        <label>Пара</label>
        <input type="text" id="pair-input" placeholder="Напр., BTC/USDT" value="BTC/USDT">
        <datalist id="pair-suggestions"></datalist>
      </div>

      <div class="filter-group">
        <label>Сумма сделки (USDT)</label>
        <input type="number" id="amount-input" placeholder="1000" value="1000" min="1">
      </div>

      <div class="filter-group">
        <label>Мин. ликвидность (USDT)</label>
        <input type="number" id="liquidity-input" placeholder="5000" value="5000" min="1">
      </div>

      <div class="filter-group">
        <label>Мин. спред (%)</label>
        <input type="number" id="spread-input" placeholder="0.1" value="0.1" min="0" step="0.01">
      </div>

      <button id="scan-btn" class="btn btn-primary">🔍 Сканировать</button>
    </section>

    <!-- RESULTS -->
    <section id="results" class="results" style="display: none;">
      <div class="results-header">
        <h2>🔌 Потенциальные сигналы: <span id="signal-count">0</span></h2>
        <div class="sort-controls">
          <label>Сортировка:</label>
          <select id="sort-select">
            <option value="profit">По прибыли</option>
            <option value="spread">По спреду</option>
            <option value="liquidity">По ликвидности</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="signals-table" class="signals-table">
          <thead>
            <tr>
              <th>Пара</th>
              <th>Купить</th>
              <th>Цена покупки</th>
              <th>Продать</th>
              <th>Цена продажи</th>
              <th>Грусс-спред</th>
              <th>Нет-спред</th>
              <th>Прибыль</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="signals-body">
          </tbody>
        </table>
      </div>
    </section>

    <!-- NO SIGNALS -->
    <div id="no-signals" class="no-signals" style="display: none;">
      <p>🔍 Не найдено реальных неэффективностей по заданным параметрам.</p>
    </div>

    <!-- SIGNAL DETAILS MODAL -->
    <div id="modal" class="modal" style="display: none;">
      <div class="modal-content">
        <button class="close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="/js/api-client.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
